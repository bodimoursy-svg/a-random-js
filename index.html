<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17152b">
  <title>Guess the Number</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #11101d;
      --panel: #1d1a31;
      --purple: #b9a0ff;
      --text: #f7f4ff;
      --muted: #c7c0dc;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: radial-gradient(ellipse at top, #302454 0%, var(--bg) 60%);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      width: min(100%, 440px);
      padding: 28px;
      border: 1px solid #51466f;
      border-radius: 24px;
      background: color-mix(in srgb, var(--panel) 94%, transparent);
      box-shadow: 0 18px 60px #0005;
      text-align: center;
    }
    .eyebrow {
      margin: 0 0 8px;
      color: var(--purple);
      font-size: .8rem;
      font-weight: 800;
      letter-spacing: .16em;
      text-transform: uppercase;
    }
    h1 { margin: 0; font-size: clamp(2rem, 8vw, 2.7rem); }
    .intro { color: var(--muted); line-height: 1.55; }
    form { display: flex; gap: 10px; margin-top: 24px; }
    input, button {
      min-height: 52px;
      border-radius: 14px;
      font: inherit;
    }
    input {
      min-width: 0;
      flex: 1;
      padding: 0 14px;
      border: 1px solid #65558d;
      background: #100e1c;
      color: var(--text);
      font-size: 1.1rem;
    }
    button {
      padding: 0 18px;
      border: 0;
      background: var(--purple);
      color: #20163c;
      font-weight: 800;
      cursor: pointer;
      touch-action: manipulation;
    }
    button:focus-visible, input:focus-visible { outline: 3px solid white; outline-offset: 3px; }
    button:active { transform: translateY(1px); }
    #message {
      min-height: 3.2em;
      margin: 22px 0 0;
      color: var(--muted);
      line-height: 1.5;
    }
    .new-game {
      margin-top: 8px;
      background: transparent;
      color: var(--purple);
      border: 1px solid #65558d;
    }
    .small { margin: 18px 0 0; color: #aaa2c5; font-size: .85rem; }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Mini game</p>
    <h1>Guess the Number</h1>
    <p class="intro">I'm thinking of a number from <strong>1 to 5</strong>. Can you guess it?</p>

    <form id="guess-form">
      <input id="guess" type="number" min="1" max="5" step="1"
        inputmode="numeric" placeholder="1–5" aria-label="Your guess" required>
      <button type="submit">Guess</button>
    </form>

    <p id="message" role="status" aria-live="polite">Enter a number to begin!</p>
    <button id="restart" class="new-game" type="button">New round</button>
    <p class="small">Made with HTML, CSS and JavaScript.</p>
  </main>

  <script>
    "use strict";

    const form = document.getElementById("guess-form");
    const input = document.getElementById("guess");
    const message = document.getElementById("message");
    const restartButton = document.getElementById("restart");

    let secretNumber = newSecretNumber();
    let finished = false;

    function newSecretNumber() {
      return Math.floor(Math.random() * 5) + 1;
    }

    form.addEventListener("submit", function (event) {
      event.preventDefault();
      if (finished) return;

      const guess = Number(input.value);

      if (!Number.isInteger(guess) || guess < 1 || guess > 5) {
        message.textContent = "Please enter a whole number from 1 to 5.";
        input.focus();
        return;
      }

      if (guess === secretNumber) {
        message.textContent = "Great! You guessed it right! 🎉";
        finished = true;
        input.disabled = true;
        form.querySelector("button").disabled = true;
      } else {
        message.textContent = "Not quite! The number was " + secretNumber + ". Try a new round!";
      }
    });

    restartButton.addEventListener("click", function () {
      secretNumber = newSecretNumber();
      finished = false;
      input.disabled = false;
      form.querySelector("button").disabled = false;
      input.value = "";
      message.textContent = "New number chosen. Try again!";
      input.focus();
    });
  </script>
</body>
</html>
